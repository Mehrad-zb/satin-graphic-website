<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Messages · Satin Graphic</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/satin/img/favicon-32.png"><link rel="apple-touch-icon" href="/satin/img/apple-touch-icon.png">
<style>
@font-face{font-family:Inter;src:url(/satin/fonts/inter-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/satin/fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0600-06FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
:root{--ink:#16181d;--ink2:#3d4452;--mut:#6b7280;--line:#e5e7eb;--soft:#f6f7f9;--accent:#c91c50}
*{box-sizing:border-box}
body{margin:0;background:#eceef2;font:15px/1.55 Inter,Vazirmatn,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top img{height:22px;width:auto}
.top a{color:var(--ink2);font-size:13px;text-decoration:none}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.head small{color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.head h1{margin:4px 0 2px;font-size:22px;line-height:1.25}
.head p{margin:0;color:var(--mut);font-size:13.5px}
.msgs{display:flex;flex-direction:column;gap:14px;margin:20px 0}
.m{max-width:86%;display:flex;flex-direction:column;gap:4px}
.m.in{align-self:flex-end;align-items:flex-end}
.m .who{font-size:12px;color:var(--mut)}
.m .b{padding:12px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line)}
.m.in .b{background:#111827;color:#fff;border-color:#111827;border-bottom-right-radius:6px}
.m.out .b{border-bottom-left-radius:6px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files a{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);text-decoration:none}
form textarea{width:100%;min-height:110px;border:1px solid #d1d5db;border-radius:12px;padding:12px;font:inherit;resize:vertical}
form textarea:focus{outline:2px solid #111827;outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:13px}
.btn{border:0;background:#111827;color:#fff;border-radius:999px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55}
.err{background:#fef2f2;color:#991b1b;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.ok{background:#ecfdf5;color:#065f46;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/satin/"><img src="/satin/img/logo.png" alt="Satin Graphic"></a><a href="tel:+19056959147">(905) 695-9147</a></div>
  <div class="card" id="app"><p class="hint">Loading…</p></div>
  <p class="foot">Satin Graphic · 50 Viceroy Rd, Unit 22–23, Vaughan, ON · <a href="mailto:info@satingraphic.ca">info@satingraphic.ca</a></p>
</div>
<script>
(() => {
  const app = document.getElementById('app');
  const t = new URLSearchParams(location.search).get('t') || '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' }); };
  let data = null;
  const draw = (note) => {
    const r = data.request;
    app.innerHTML = `<div class="head"><small>${r.type === 'booking' ? 'Booking' : 'Quote request'} · ${esc(r.reference)} · ${esc(r.status)}</small><h1>${esc(r.service)}</h1><p>Your conversation with Satin Graphic</p></div>
      <div class="msgs">${data.messages.map(m => `<div class="m ${m.dir}"><span class="who">${esc(m.dir === 'in' ? 'You' : m.who)} · ${esc(when(m.at))}${m.source === 'email' && m.dir === 'in' ? ' · by email' : ''}</span><div class="b" dir="auto">${esc(m.body)}</div>
        ${m.files && m.files.length ? `<div class="files">${m.files.map((f, n) => `<a href="/api/thread/file?t=${encodeURIComponent(t)}&id=${encodeURIComponent(m.id)}&n=${n}">📎 ${esc(f.name)}</a>`).join('')}</div>` : ''}</div>`).join('')}</div>
      <form id="f"><label for="body" class="hint">Write a reply</label><textarea id="body" name="body" dir="auto" maxlength="8000" placeholder="Your message to Satin Graphic…" required></textarea>
      <div class="row"><span class="hint">We usually answer within one business day.</span><button class="btn" type="submit">Send message</button></div><div id="msg">${note || ''}</div></form>`;
    const f = document.getElementById('f');
    f.onsubmit = async e => {
      e.preventDefault(); const b = f.querySelector('button'); b.disabled = true;
      try {
        const res = await fetch('/api/thread/reply', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t, body: f.body.value }) });
        const d = await res.json(); if (!res.ok) throw new Error(d.error || 'Could not send. Please try again.');
        data.messages = d.messages; draw('<div class="ok">Sent. We will get back to you soon — you will get our answer by email.</div>');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } catch (er) { document.getElementById('msg').innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; }
    };
  };
  fetch('/api/thread?t=' + encodeURIComponent(t), { credentials: 'same-origin' }).then(r => r.json().then(d => ({ ok: r.ok, d }))).then(({ ok, d }) => {
    if (!ok) throw new Error(d.error || 'This link is not valid.');
    data = d; draw();
  }).catch(e => { app.innerHTML = `<div class="err">${esc(e.message)}</div><p class="hint">Need help? Call (905) 695-9147 or email info@satingraphic.ca.</p>`; });
})();
</script>
</body>
</html>
