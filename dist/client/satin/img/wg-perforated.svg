<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter,Arial,sans-serif">
<defs>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#000" opacity="0"/><circle cx="7" cy="7" r="3.4" fill="#fff"/></pattern>
<pattern id="holes" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H14V14H0Z M7 3.6a3.4 3.4 0 1 0 0.01 0Z" fill="#14161a" fill-rule="evenodd"/></pattern>
<mask id="m-holes"><rect width="1200" height="760" fill="#fff"/><rect x="620" y="70" width="520" height="560" fill="url(#holes)"/></mask>
<mask id="m-print"><rect width="1200" height="760" fill="#fff"/><rect x="60" y="70" width="520" height="560" fill="url(#dots)" opacity=".35"/></mask>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c91c50"/><stop offset=".55" stop-color="#e85a3a"/><stop offset="1" stop-color="#f4b23c"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc6ea"/><stop offset="1" stop-color="#e3eef8"/></linearGradient>
<clipPath id="cl"><rect x="60" y="70" width="520" height="560" rx="6"/></clipPath>
<clipPath id="cr"><rect x="620" y="70" width="520" height="560" rx="6"/></clipPath>
</defs>
<rect width="1200" height="760" fill="#f3f4f6"/>
<!-- outside: printed graphic -->
<g clip-path="url(#cl)"><g mask="url(#m-print)">
<rect x="60" y="70" width="520" height="560" fill="url(#g1)"/>
<circle cx="470" cy="190" r="150" fill="#fff" opacity=".14"/><circle cx="140" cy="560" r="190" fill="#17191e" opacity=".14"/>
<text x="100" y="250" font-size="78" font-weight="900" fill="#fff">SUMMER</text>
<text x="100" y="335" font-size="78" font-weight="900" fill="#fff">SALE</text>
<text x="100" y="395" font-size="30" font-weight="600" fill="#fff" opacity=".92">Up to 40% off in store</text>
<rect x="100" y="440" width="230" height="58" rx="29" fill="#17191e"/><text x="215" y="478" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">YOUR BRAND</text>
</g></g>
<rect x="60" y="70" width="520" height="560" rx="6" fill="none" stroke="#2b2f36" stroke-width="10"/>
<!-- inside: view through -->
<g clip-path="url(#cr)">
<rect x="620" y="70" width="520" height="560" fill="url(#sky)"/>
<rect x="640" y="250" width="120" height="380" fill="#c7cfd8"/><rect x="770" y="190" width="150" height="440" fill="#b5bfca"/><rect x="930" y="290" width="110" height="340" fill="#d2d8df"/><rect x="1045" y="230" width="100" height="400" fill="#aeb8c4"/>
<g fill="#e9eef3" opacity=".9"><rect x="790" y="215" width="22" height="30"/><rect x="830" y="215" width="22" height="30"/><rect x="870" y="215" width="22" height="30"/><rect x="790" y="265" width="22" height="30"/><rect x="830" y="265" width="22" height="30"/><rect x="870" y="265" width="22" height="30"/><rect x="790" y="315" width="22" height="30"/><rect x="830" y="315" width="22" height="30"/><rect x="870" y="315" width="22" height="30"/></g>
<circle cx="700" cy="470" r="70" fill="#6d9b62"/><rect x="694" y="500" width="12" height="130" fill="#5c4a3a"/>
<rect x="620" y="560" width="520" height="70" fill="#9aa1aa"/>
<rect x="620" y="70" width="520" height="560" fill="url(#holes)" opacity=".5"/>
</g>
<rect x="620" y="70" width="520" height="560" rx="6" fill="none" stroke="#2b2f36" stroke-width="10"/>
<text x="320" y="690" text-anchor="middle" font-size="28" font-weight="800" fill="#17191e">Outside: full-colour graphic</text>
<text x="880" y="690" text-anchor="middle" font-size="28" font-weight="800" fill="#17191e">Inside: you still see out</text>
<text x="600" y="735" text-anchor="middle" font-size="19" fill="#6b7078">One-way perforated vinyl · 50/50 or 70/30 perforation</text>
</svg>
